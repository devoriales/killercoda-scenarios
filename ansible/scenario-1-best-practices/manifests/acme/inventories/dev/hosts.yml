---
# DEV inventory. Hosts are grouped by ROLE (webservers, dbservers).
# In this lab all three nodes are local containers reached over SSH on distinct ports.
all:
  children:
    webservers:
      hosts:
        web1:
          ansible_host: 127.0.0.1
          ansible_port: 2201
        web2:
          ansible_host: 127.0.0.1
          ansible_port: 2202
    dbservers:
      hosts:
        db1:
          ansible_host: 127.0.0.1
          ansible_port: 2203
