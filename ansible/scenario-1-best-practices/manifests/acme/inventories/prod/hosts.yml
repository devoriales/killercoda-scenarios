---
# PROD inventory. Same node topology as dev in this lab, but a SEPARATE directory:
# dev changes physically cannot touch prod, because prod is an inventory you must
# select explicitly with `-i inventories/prod/hosts.yml`.
all:
  children:
    webservers:
      hosts:
        web1:
          ansible_host: 127.0.0.1
          ansible_port: 2201
        web2:
          ansible_host: 127.0.0.1
          ansible_port: 2202
    dbservers:
      hosts:
        db1:
          ansible_host: 127.0.0.1
          ansible_port: 2203
