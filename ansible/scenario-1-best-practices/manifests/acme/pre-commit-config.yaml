---
# Stored as pre-commit-config.yaml in the asset tree; background.sh renames it to
# .pre-commit-config.yaml on the student VM. Net 2 of the Git safety nets.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ansible-vault-encrypted
        name: Ensure vault.yml files are encrypted
        entry: scripts/check-vault-encrypted.sh
        language: script
        files: 'group_vars/.*/vault\.yml$'
